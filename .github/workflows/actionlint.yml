name: Lint GitHub Actions workflows

on: [pull_request, merge_group]

jobs:
    actionlint:
        name: "Lint GitHub Actions workflows"
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # Needed to print the results
            checks: write
            pull-requests: read
        steps:
            - uses: actions/checkout@v6

            - name: Run actionlint
              uses: reviewdog/action-actionlint@v1
              with:
                  fail_level: any
                  actionlint_flags: ""
