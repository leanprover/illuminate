name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  enable-cache: true

            - name: Cache Playwright browsers
              uses: actions/cache@v5.1.0
              with:
                  path: .playwright-browsers
                  key: playwright-${{ runner.os }}-${{ hashFiles('test_playwright.py') }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.4.1

            - name: Build Inkscape Docker image
              uses: docker/build-push-action@v7.4.0
              with:
                  context: visual_tests
                  tags: illuminate-inkscape
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - uses: leanprover/lean-action@v1.7.1
              with:
                  build-args: --wfail
                  test-args: --wfail

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: "lts/*"
                  cache: npm

            - name: Install JavaScript dependencies
              run: npm ci

            - name: Type check player JS
              run: npx tsc --noEmit -p player_js/jsconfig.json

            - name: Check imports with lake shake
              run: lake shake

            - name: Visual and structural tests
              run: uv run test_playwright.py
